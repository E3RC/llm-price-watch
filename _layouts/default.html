<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap nav-wrap">
      <a class="brand" href="{{ '/' | relative_url }}">LLM Price Watch</a>
      <nav aria-label="Primary navigation">
        <a href="{{ '/' | relative_url }}">Latest</a>
        <a href="{{ '/deals/' | relative_url }}">Deals</a>
        <a href="{{ '/archive/' | relative_url }}">Archive</a>
        <a href="{{ '/about/' | relative_url }}">Methodology</a>
      </nav>
    </div>
  </header>

  <main class="wrap page-shell">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-row">
      <span>Independent daily model-market watch.</span>
      <span><a href="{{ '/feed.xml' | relative_url }}">RSS</a> · <a href="https://github.com/E3RC/llm-price-watch">GitHub</a></span>
    </div>
  </footer>
</body>
</html>
